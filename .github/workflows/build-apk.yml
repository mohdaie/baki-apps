name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run parser tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: baki-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the "latest" release (easy download on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Baki.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Baki.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download Baki.apk on your phone and install." \
            --prerelease
